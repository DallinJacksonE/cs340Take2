  visitTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: visit
      AttributeDefinitions:
      - AttributeName: person_name
        AttributeType: S
      - AttributeName: place_name
        AttributeType: S
      KeySchema:
      - AttributeName: person_name
        KeyType: HASH
      - AttributeName: place_name
        KeyType: RANGE
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 1
        WriteCapacityUnits: 1
      GlobalSecondaryIndexes:
      - IndexName: place_index
        KeySchema:
        - AttributeName: place_name
          KeyType: HASH
        - AttributeName: person_name
          KeyType: RANGE
        ProvisionedThroughput:
          ReadCapacityUnits: 1
          WriteCapacityUnits: 1
        Projection:
          ProjectionType: ALL
  followTable:
